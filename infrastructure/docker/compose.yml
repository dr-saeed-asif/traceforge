services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traceforge}
      POSTGRES_USER: ${POSTGRES_USER:-traceforge_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceforge_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - traceforge-postgres:/var/lib/postgresql/data

volumes:
  traceforge-postgres:
