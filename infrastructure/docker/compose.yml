services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-traceforge}
      MYSQL_USER: ${MYSQL_USER:-traceforge_owner}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traceforge_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-traceforge_root_local_only}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - traceforge-mysql:/var/lib/mysql

volumes:
  traceforge-mysql:
